name: Publish Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: 'Select the package to publish'
        required: true
        type: choice
        default: '@phottamai/ds-b2b'
        options:
          - '@phottamai/ds-b2b'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Build & Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # Needed for changesets to push tag & release commits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@phottamai'

      - name: Install Dependencies
        run: npm ci

      # Automated push to main (standard Changesets flow)
      - name: Create Version PR or Publish (Automated)
        id: changesets
        if: github.event_name == 'push'
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual trigger: publish the selected package at its current version
      - name: Manual Publish Flow
        id: manual-publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          TARGET_PACKAGE="${{ inputs.package }}"
          echo "Target package specified: $TARGET_PACKAGE"

          npm run build --workspace="$TARGET_PACKAGE"
          npm publish --workspace="$TARGET_PACKAGE"

          PKG_DIR=$(npm query ".workspace" | node -e "const w=JSON.parse(require('fs').readFileSync(0,'utf8')).find(p=>p.name===process.argv[1]);console.log(w.location)" "$TARGET_PACKAGE")
          UPDATED_VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
          echo "version=$UPDATED_VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Job Summary
        if: ${{ !cancelled() }}
        run: |
          DS_B2B_VER=$(node -p "require('./ds-b2b/package.json').version" 2>/dev/null || echo "Unknown")

          echo "### 📦 Workspace Package Status" >> $GITHUB_STEP_SUMMARY
          echo "| Package Name | Current Repo Version | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| \`@phottamai/ds-b2b\` | \`$DS_B2B_VER\` | B2B UI primitives (buttons, form items, modals) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "### 🚀 Automated Publish Summary" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
              echo "Published to GitHub Packages:" >> $GITHUB_STEP_SUMMARY
              echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "- **\(.name)**: `\(.version)`"' >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ No new packages were published (all versions already exist on GitHub Packages)." >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "### 🚀 Manual Publish Summary" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.manual-publish.outcome }}" = "success" ]; then
              echo "- **Package:** \`${{ inputs.package }}\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Published Version:** \`${{ steps.manual-publish.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Manual publish step failed. Please check the workflow logs." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Discord Notification
        if: always()
        continue-on-error: true
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_PACKAGE: ${{ inputs.package }}
          TARGET_VERSION: ${{ steps.manual-publish.outputs.version }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Design System Publish Successful"
          elif [ "${{ job.status }}" = "cancelled" ]; then
            COLOR=16776960
            TITLE="⚠️ Design System Publish Cancelled"
          else
            COLOR=15158332
            TITLE="❌ Design System Publish Failed"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER_TYPE="Manual (workflow_dispatch)"
            PACKAGES_TEXT="- **${TARGET_PACKAGE}**: \`${TARGET_VERSION}\`"
          else
            TRIGGER_TYPE="Automated (push)"
            if [ -n "$PUBLISHED_PACKAGES" ] && [ "$PUBLISHED_PACKAGES" != "[]" ]; then
              PACKAGES_TEXT=$(echo "$PUBLISHED_PACKAGES" | jq -r 'map("- **\(.name)**: `\(.version)`") | join("\n")')
            else
              PACKAGES_TEXT=""
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg trigger "$TRIGGER_TYPE" \
            --arg packages "$PACKAGES_TEXT" \
            --arg actor "$ACTOR" \
            --argjson color "$COLOR" \
            '
            (if ($packages | length) > 0 then "\nPackages:\n" + $packages else "" end) as $packagesBlock |
            ("Service: **Design System**\nTrigger: **" + $trigger + "**" + $packagesBlock + "\nTriggered By: **" + $actor + "**") as $desc |
            {"embeds":[{"title":$title,"description":$desc,"color":$color}]}
            ')

          curl --fail -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}"
