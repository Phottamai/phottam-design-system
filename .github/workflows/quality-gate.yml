name: CI Quality Gate

on:
  pull_request:
    branches:
      - '**'

jobs:
  quality-gate:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@phottamai'

      - name: Install Dependencies
        run: npm ci

      # Fails when the package version already exists on GitHub Packages (it wasn't incremented).
      - name: Check Version Was Incremented
        run: npm run version:check -- --changed-since "origin/${{ github.base_ref }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Code Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Verify Package Build
        run: npm run build

      - name: Verify Storybook Build
        run: npm run build-storybook
