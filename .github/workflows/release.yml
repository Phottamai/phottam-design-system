name: Release Packages

# Every merge to main or develop publishes the version committed in the package's package.json
# (bumped by the pre-commit hook). main publishes with dist-tag "latest", develop with "develop".
# Packages without changes are skipped; a changed package whose version is already published
# fails the run (the version wasn't incremented).
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Releases run one at a time across branches.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # Full history so the release can see what changed since the previous push.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@phottamai'

      - name: Install Dependencies
        run: npm ci

      - name: Quality Checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Build Packages
        run: npm run build

      - name: Publish to GitHub Packages
        id: publish
        run: node scripts/release.mjs --channel "${{ github.ref_name }}" --changed-since "${{ github.event.before }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Releases
        if: steps.publish.outputs.released != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED: ${{ steps.publish.outputs.released }}
        run: |
          echo "$RELEASED" | jq -c '.[]' | while read -r pkg; do
            NAME=$(echo "$pkg" | jq -r '.name')
            VERSION=$(echo "$pkg" | jq -r '.version')
            # develop releases are marked as pre-releases on GitHub; main releases become "Latest".
            FLAGS=""
            if [ "$GITHUB_REF_NAME" = "develop" ]; then FLAGS="--prerelease"; fi
            gh release create "$NAME@$VERSION" $FLAGS \
              --target "$GITHUB_SHA" \
              --title "$NAME@$VERSION ($GITHUB_REF_NAME)" \
              --generate-notes
          done

      - name: Job Summary
        if: ${{ !cancelled() }}
        env:
          RELEASED: ${{ steps.publish.outputs.released }}
        run: |
          echo "### 📦 Release from \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RELEASED" ] && [ "$RELEASED" != "[]" ]; then
            echo "| Package | Version | npm dist-tag |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "$RELEASED" | jq -r '.[] | "| `\(.name)` | `\(.version)` | `\(.tag)` |"' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Install: \`npm install $(echo "$RELEASED" | jq -r '.[0] | "\(.name)@\(.version)"')\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Nothing was published (see the **Publish to GitHub Packages** step)." >> $GITHUB_STEP_SUMMARY
          fi
